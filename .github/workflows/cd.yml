name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Shared VPS deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    uses: lethanh2006/Logger/.github/workflows/reusable-vps-cd.yml@d274b289a561fd7c6e3637995482a75a89af4773
    with:
      service-name: auth
      deploy-revision: ${{ github.event.workflow_run.head_sha }}
      default-branch: ${{ github.event.repository.default_branch }}
      platform-ref: d274b289a561fd7c6e3637995482a75a89af4773
    secrets:
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
